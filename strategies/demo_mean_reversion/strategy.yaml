strategy_id: demo_mean_reversion
name: 演示均值回归策略
style: MEAN_REVERSION
instruments: ["BTC-USDT-PERP"]
interval: "5m"
asset_class_support: ["PERPETUAL"]

params_schema:
  type: object
  required: [lookback, entry_z, exit_z, position_size]
  properties:
    lookback:
      type: integer
      minimum: 20
      maximum: 200
      default: 50
      step: 10
      description: 均线回看周期
    entry_z:
      type: number
      minimum: 1.0
      maximum: 3.0
      default: 2.0
      step: 0.1
      description: 入场 Z-Score 阈值
    exit_z:
      type: number
      minimum: 0.0
      maximum: 1.0
      default: 0.5
      step: 0.1
      description: 出场 Z-Score 阈值
    position_size:
      type: number
      minimum: 0.01
      maximum: 0.5
      default: 0.1
      step: 0.01
      description: 仓位大小

features: ["returns", "realized_vol_20"]

runtime_constraints:
  allow_network: false
  allow_file_io: false
  allow_threads: false
  allow_subprocess: false
  allow_imports: ["numpy", "polars", "qps.core.models", "qps.core.sdk"]